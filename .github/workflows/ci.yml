name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prohelp-cli
        uses: actions/checkout@v4
        with:
          path: prohelp-cli

      - name: Checkout prohelp (path dependency)
        uses: actions/checkout@v4
        with:
          repository: openshellorg/prohelp
          path: prohelp

      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Build
        working-directory: prohelp-cli
        run: dub build -c library

  release:
    name: GitHub Release (library tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## prohelp-cli ${{ github.ref_name }}

            D CLI-framework bridges for [prohelp](https://github.com/openshellorg/prohelp).
            Library-only package — add as a DUB path/git dependency; no standalone binary.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
