name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout prohelp-cli
        uses: actions/checkout@v7
        with:
          path: prohelp-cli

      - name: Checkout prohelp (path dependency)
        uses: actions/checkout@v7
        with:
          repository: openshellorg/prohelp
          ref: v0.2.3
          path: prohelp

      - name: Checkout config-lifecycle (path dependency)
        uses: actions/checkout@v7
        with:
          repository: openshellorg/config-lifecycle
          path: config-lifecycle

      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Build library
        working-directory: prohelp-cli
        run: dub build -c library

      - name: Build demo binary
        working-directory: prohelp-cli
        run: dub build -c demo --build=release

      - name: Smoke demo
        working-directory: prohelp-cli
        shell: bash
        run: |
          if [ -f prohelp-cli-demo.exe ]; then BIN=./prohelp-cli-demo.exe; else BIN=./prohelp-cli-demo; fi
          "$BIN" --help || "$BIN" ?
          "$BIN" check-config || true
